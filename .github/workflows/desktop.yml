name: Build DSU desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev libgtk-3-dev libnss3 libasound2-dev xvfb
      - run: npm ci
      - run: npm run check
      - run: npm run fork:prepare
      - run: npm run desktop:install
      - run: npm run desktop:package
      - name: Test packaged desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Test packaged desktop (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: dsu-desktop-${{ matrix.os }}
          path: |
            vendor/VSCode-*/
            dist/validation/packaged-smoke.json
          if-no-files-found: error
