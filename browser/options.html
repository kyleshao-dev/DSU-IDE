<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>DSU IDE · 浏览器连接</title>
<link rel="stylesheet" href="options.css"><main><div class="badge">DSU IDE / <span id="version"></span></div>
<h1>把题目带进编辑器。</h1><p>打开 IDE 与做题文件夹，在主页「设置 → 配对外部浏览器」复制配对信息，再粘贴到下方。端口会自动填写。请勿分享配对信息。</p>
<form id="connect"><label>配对信息或旧版令牌<input id="token" type="password" required autocomplete="off"></label><label>本机端口<input id="port" type="number" value="27121" min="1024" max="65535" required></label><button>保存并测试连接</button></form>
<details><summary>添加自己的 OJ（可选）</summary><h2>授权网站</h2><p>先在 IDE 的配置文件添加 OJ 适配器，再授权对应网站。授权后刷新题目页。</p>
<form id="authorize"><label>网站地址<input id="origin" type="url" placeholder="https://oj.example.com" required></label><button>授权这个网站</button></form>
</details><button id="disconnect" type="button">断开配对</button><output id="status" role="status"></output><p>连接成功后，在 OJ 题目页面点击「在 DSU IDE 创建题目」，或点击工具栏图标导入当前题目。外部浏览器提交需在 IDE 设置中将 <code>dsu.submissionBrowser</code> 设为 <code>external</code>，并把当前浏览器设为系统默认浏览器。</p><p class="foot">Chrome · Edge · 内置浏览器免配对</p></main><script type="module" src="options.js"></script></html>
